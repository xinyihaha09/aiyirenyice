schedule(2100,()=>{$('.thinking-label').textContent='正在整理查询结果';$('#loading-label').textContent='正在生成结果表格…';});schedule(3300,()=>{cancel();const year=q.match(/20\d{2}/)?.[0]||'2025';const fleet=q.match(/(?:B)?(777|737|787|A320)/i)?.[1]||'777';const score=q.match(/(?:得分|评分)(?:为)?\s*([1-5])/)?.[1]||'2';resultRows=rows.filter(r=>year==='2025'&&r.fleet===fleet&&r.score===Number(score));$('.thinking-label').textContent='思考过程';$('.thought').textContent='数据源：qar及ebt数据；年份：'+year+'；机型组：'+fleet+'；胜任力得分：'+score+'。查询使用录屏页面数据。';$('.thought').style.display='none';$('.thinking').setAttribute('aria-expanded','false');renderResult(year,fleet,score);$('.query-status').textContent='查询完成';});}
function renderResult(year,fleet,score){$('#answer-content').innerHTML='<div class="result-card"><div class="result-heading"><h3>'+esc(year+'年'+fleet+'机型组'+score+'分用户列表')+'</h3><div class="result-tools"><button id="table-view" aria-label="表格视图">'+icon('table')+'</button><button id="show-sql" aria-label="查看SQL">'+icon('sql')+'</button><button id="download" aria-label="导出CSV">'+icon('download')+'</button><button id="expand" aria-label="展开表格">'+icon('expand')+'</button></div></div><div class="result-table-wrap"><table class="result-table"><thead><tr>'+['用户姓名','员工编号','机型组','胜任力得分'].map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+resultRows.map(r=>'<tr>'+Object.values(r).map((x,i)=>'<td>'+esc(i===3?Number(x).toFixed(1):x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>'+(!resultRows.length?'<div class="query-error">录屏页面数据中没有符合该条件的记录。</div>':'')+'</div><div class="result-meta">共 '+resultRows.length+' 条 · 数据源：qar及ebt数据 · 录屏可见记录摘录</div></div><button class="replay-search">重新演示问数过程</button>';$('.replay-search').onclick=()=>runDemo();$('#show-sql').onclick=()=>{$('.sql-content').textContent="SELECT DISTINCT name AS user_name, staff_num AS staff_num, FLEET_CD AS fleet_cd, ability_scores AS ability_scores\nFROM ads_eplm_pilot_ebt_ob AS t1\nWHERE str_time >= '"+year+"-01-01'\n  AND str_time < '"+(Number(year)+1)+"-01-01'\n  AND FLEET_CD = '"+fleet+"' AND ability_scores = "+score+";";$('dialog').showModal()};$('#download').onclick=()=>{const csv='\ufeff用户姓名,员工编号,机型组,胜任力得分\n'+resultRows.map(r=>Object.values(r).join(',')).join('\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='智能问数_演示结果.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};const chart=document.createElement('div');chart.id='query-chart';chart.hidden=true;chart.style.cssText='padding:20px;max-height:360px;overflow:auto';chart.innerHTML='<h3>777机型组 · 2分人员</h3>'+resultRows.map(r=>'<div style="display:flex;align-items:center;gap:12px;margin:12px 0"><span style="width:70px">'+esc(r.name)+'</span><div style="height:14px;width:40%;background:#4f87f7;border-radius:3px"></div><b>2.0</b></div>').join('');$('.result-card').append(chart);const chartButton=document.createElement('button');chartButton.textContent='图表';chartButton.setAttribute('aria-label','图表视图');$('.result-tools').prepend(chartButton);chartButton.onclick=()=>{chart.hidden=false;$('.result-table-wrap').hidden=true;};$('#table-view').onclick=()=>{chart.hidden=true;$('.result-table-wrap').hidden=false;};$('#expand').onclick=()=>{const el=$('.result-table-wrap');el.style.maxHeight=el.style.maxHeight==='none'?'330px':'none'};}
function runDemo(){reset();for(let i=0;i<=example.length;i++)schedule(300+i*45,()=>{$('.composer textarea').value=example.slice(0,i)});schedule(300+example.length*45+400,()=>startQuery(example));}
$('.new').onclick=reset;$('.composer').onsubmit=e=>{e.preventDefault();const q=$('.composer textarea').value.trim();if(q)startQuery(q)};$('.composer textarea').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('.composer').requestSubmit()}};$('.thinking').onclick=()=>{const open=$('.thinking').getAttribute('aria-expanded')!=='true';$('.thinking').setAttribute('aria-expanded',open);$('.thought').style.display=open?'block':'none'};$('.history-search').oninput=historyList;$('.close-dialog').onclick=()=>$('dialog').close();$('.collapse').onclick=()=>document.body.classList.toggle('nav-small');$('.menu').onclick=()=>document.body.classList.toggle('history-hidden');document.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>{if(b.dataset.module==='智能问数')reset();else parent.postMessage({type:'qa-navigate',module:b.dataset.module},'*')});window.dataReference={reset,runDemo,startQuery,showChart:()=>document.querySelector('[aria-label="图表视图"]')?.click(),showTable:()=>document.querySelector('#table-view')?.click()};reset();historyList();
</script>
