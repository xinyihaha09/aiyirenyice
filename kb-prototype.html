function drawSelected(){const el=$('.selected-files');if(el)el.innerHTML=uploadSelection.map(f=>'<p>'+icon('file')+' '+escapeHtml(f.name)+' <small>'+Math.round(f.size/1024)+' KB</small></p>').join('');}
function commitUpload(metadata=[]){const library=activeLibrary;const added=uploadSelection.map((f,i)=>({id:Math.max(-1,...files.map(x=>x.id))+1+i,name:f.name,size:(f.size/1048576).toFixed(2)+' MB',status:'上传中',sliceCount:0,date:'2026-10-28 15:30:00',library,rule:{...splitRule},expiry:metadata[i]?.expiry,description:metadata[i]?.description,originalFile:f.sample?null:f,sample:!!f.sample,excerpts:[]}));files.unshift(...added);$('.small-dialog').close();$('.small-dialog').classList.remove('upload-dialog');showFiles();function refresh(){if($('.table-wrap')&&!$('.detail').open)renderRows();}setTimeout(()=>{added.forEach(f=>f.status='解析中');refresh();},1100);setTimeout(async()=>{for(const f of added){if(f.originalFile&&/\.(txt|md|csv|json|html?)$/i.test(f.name)){f.text=await f.originalFile.text();const len=f.rule.length,step=Math.max(1,len-f.rule.overlap);for(let i=0;i<f.text.length;i+=step)f.excerpts.push(f.text.slice(i,i+len));}else if(f.sample){f.text='《RVSM运行手册》07版01次修订说明\n本次修订内容及相关运行要求，请核对有效手册。';f.excerpts=[f.text];}f.sliceCount=f.excerpts.length;f.status='完成';}refresh();},3600);}
openDetail=function(id=900){const file=files.find(f=>f.id===id);if(!file)return;if(file.status!=='完成'){const d=$('.small-dialog');d.innerHTML='<h2>文档正在处理</h2><p>当前状态：'+escapeHtml(file.status)+'。解析完成后可查看原文和知识切片。</p><button onclick="this.closest(\'dialog\').close()">关闭</button>';d.showModal();return;}originalOpenDetail(id);if(file.excerpts){$('.paper').innerHTML='<h3>'+escapeHtml(file.name)+'</h3><p style="white-space:pre-wrap">'+escapeHtml(file.text||'此文件的原文解析需要接入文档服务，当前演示仅保留文件记录。')+'</p>';$('.chunks-pane .count').textContent=file.excerpts.length+' 个切片';$('.chunk-scroll').innerHTML=file.excerpts.map((text,i)=>'<article class="chunk" tabindex="0" data-match="'+i+'"><header><strong>切片 '+(i+1)+'</strong><span>'+text.length+' 字符</span></header><p>'+escapeHtml(text)+'</p></article>').join('')||'<div class="empty">当前文件尚未接入文档解析服务</div>';$('.chunk-footer').textContent='共 '+file.excerpts.length+' 条';$('.chunk-search input').oninput=e=>{document.querySelectorAll('.chunk').forEach(card=>card.hidden=!card.textContent.includes(e.target.value));};}if(file.id===900){$('.chunks-pane .pane-title').insertAdjacentHTML('beforeend','<small class="hint">录屏共575片 · 此处展示3片摘录</small>');}document.querySelectorAll('.chunk').forEach(card=>card.addEventListener('click',()=>{document.querySelectorAll('.chunk').forEach(x=>x.classList.remove('matched'));card.classList.add('matched');$('.paper').classList.add('matched');setTimeout(()=>$('.paper')?.classList.remove('matched'),1800);}));};
function openRecall(){const d=$('.small-dialog');d.classList.add('workflow-dialog');d.innerHTML='<h2>召回测试</h2><form><label>知识库<select name="library">'+libraries.map(x=>'<option '+(x===activeLibrary?'selected':'')+'>'+escapeHtml(x)+'</option>').join('')+'</select></label><label>检索模式<select><option>混合检索</option><option>语义检索</option></select></label><label>Top K<input name="topk" type="number" min="1" max="20" value="5"></label><label>测试问题<textarea required rows="3" placeholder="请输入要测试的问题"></textarea></label><div class="actions"><button type="button" class="cancel">关闭</button><button class="primary">开始测试</button></div><div class="recall-results" aria-live="polite"></div></form>';d.querySelector('.cancel').onclick=()=>d.close();d.querySelector('form').onsubmit=e=>{e.preventDefault();const q=d.querySelector('textarea').value.trim();const library=d.querySelector('[name=library]').value;const candidates=files.filter(f=>f.library===library&&f.status==='完成').flatMap(f=>(f.excerpts||(f.id===3?chunkTexts:[])).map(text=>({file:f,text})));const terms=q.split(/\s+/).filter(Boolean);const results=candidates.map(c=>({...c,score:terms.reduce((n,t)=>n+(c.text.includes(t)||c.file.name.includes(t)?1:0),0)})).filter(c=>c.score>0).slice(0,+d.querySelector('[name=topk]').value);d.querySelector('.recall-results').innerHTML=results.length?results.map(c=>'<article class="chunk"><b>'+escapeHtml(c.file.name)+'</b><p>'+escapeHtml(c.text)+'</p></article>').join(''):'<p class="empty">未找到匹配切片，请尝试文档中的关键词。</p>';};d.showModal();}
function setupKnowledgeNavigation(){const nav=$('nav');nav.innerHTML=modules.map(([name,k])=>name==='知识管理'?'<button id="knowledge-parent" aria-expanded="true">'+icon(k)+'<span class="label">知识管理</span><span>⌃</span></button><div id="knowledge-subnav"><button class="active" id="library-nav">'+icon('book')+'<span class="label">知识库管理</span></button><button id="recall-nav">'+icon('chat')+'<span class="label">召回测试</span></button></div>':'<button data-module="'+name+'">'+icon(k)+'<span class="label">'+name+'</span></button>').join('');$('#knowledge-parent').onclick=()=>{const open=$('#knowledge-parent').getAttribute('aria-expanded')==='true';$('#knowledge-parent').setAttribute('aria-expanded',!open);$('#knowledge-subnav').hidden=open;};$('#library-nav').onclick=showLibraries;$('#recall-nav').onclick=openRecall;nav.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>parent.postMessage({type:'qa-navigate',module:b.dataset.module},'*'));}
const trainingDocument={id:900,name:'B777系列机型飞行人员训练大纲.pdf',size:'4.29 MB',status:'完成',sliceCount:3,date:'2026-10-27 16:21:26',library:'777机队知识库',text:'本手册经中国民用航空中南地区管理局批准。\n手册版本号：11　修订号：02\n手册生效日期：2025年12月31日\n\n0.2 颁发说明\n中国南方航空股份有限公司《飞行人员训练大纲》\n编号：CSN-FLT-01',excerpts:['手册版本号：11；修订号：02；手册生效日期：2025年12月31日。','0.2 颁发说明：中国南方航空股份有限公司《飞行人员训练大纲》，编号：CSN-FLT-01。','《飞行人员训练大纲》是为使公司飞行机组成员能够得到充分的训练以满足安全运行的需要，根据民航规章、规范性文件和经局方批准的运行合格证、运行规范以及运行政策、程序、标准、指南为基础制定。本示例展示录屏中可读的内容摘录。']};files.unshift(trainingDocument);
function demoStage(stage){if(stage===0){document.querySelectorAll('dialog[open]').forEach(d=>d.close());showLibraries();}if(stage===1){createLibrary();$('.small-dialog [name=name]').value='777机队训练资料库';$('.small-dialog textarea').value='机组飞行手册、训练大纲与运行资料';}if(stage===2){if(!libraries.includes('777机队训练资料库'))libraries.push('777机队训练资料库');libraryInfo['777机队训练资料库']={visibility:'仅本部门',department:'777机队',description:'机组飞行手册、训练大纲与运行资料'};$('.small-dialog').close();activeLibrary='777机队训练资料库';showFiles();}if(stage===3)openUpload(true);if(stage===4)renderUpload(2);if(stage===5){splitRule={mode:'通用分段',separator:'\\n',length:600,overlap:100};commitUpload();}if(stage===6){const uploaded=files.find(f=>f.library===activeLibrary&&f.sample);if(uploaded){uploaded.status='完成';uploaded.text=uploaded.text||'《RVSM运行手册》07版01次修订说明\n本次修订内容及相关运行要求，请核对有效手册。';uploaded.excerpts=uploaded.excerpts.length?uploaded.excerpts:[uploaded.text];uploaded.sliceCount=uploaded.excerpts.length;renderRows();openDetail(uploaded.id);}}if(stage===7){const card=$('.chunk');card?.click();}}
const flowStyle=document.createElement('style');flowStyle.textContent='.workflow-dialog{width:min(660px,92vw);max-height:90vh;overflow:auto}.workflow-dialog select{width:100%;margin-top:7px}.workflow-dialog fieldset{border:0;padding:0}.workflow-dialog fieldset label{display:inline-flex;align-items:center;gap:5px;margin-right:14px;font-size:12px}.workflow-dialog input[type=radio]{display:inline;width:auto;margin:0}.required,.upload-error{color:#e35163}.file-actions{display:flex;gap:12px;align-items:center;margin:0 0 18px}.file-actions>span{flex:1}.upload-dialog{width:min(860px,94vw)}.upload-steps{display:flex;align-items:center;gap:18px;background:#eff6ff;padding:16px;margin:18px 0;color:#9ba9bc}.upload-steps i{height:1px;background:#b9d1f4;flex:1}.upload-steps .selected{color:#397fff}.drop-zone{padding:35px;text-align:center;border:1px dashed #b6cbef;border-radius:9px;background:#fafcff;cursor:pointer}.drop-zone.dragging{background:#e8f1ff}.rule-card{border:1px solid #a3c1f4;border-radius:6px;padding:16px;margin:14px 0}.rule-card p{font-size:12px;color:#8793a4}.rule-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.upload-file-row{display:grid;grid-template-columns:2fr 1fr 1.5fr auto;gap:8px;align-items:center;margin:8px 0}.upload-file-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.upload-file-row input{width:100%;font-size:12px}#knowledge-subnav button{padding-left:30px;font-size:13px}.matched{outline:2px solid #78a6f6;background:#f1f6ff!important}.recall-results{margin-top:20px}.workflow-dialog h3{font-size:14px;margin:18px 0 10px}@media(max-width:760px){.upload-file-row{grid-template-columns:1fr 1fr}.rule-fields{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr 1fr}.preview-pane{display:flex}}';document.head.append(flowStyle);
try{const saved=JSON.parse(localStorage.getItem('flight-kb-workflow-v1')||'null');if(saved){libraries=[...new Set([...libraries,...saved.libraries])];Object.assign(libraryInfo,saved.libraryInfo);for(const item of saved.files){if(!files.some(f=>f.id===item.id))files.push(item);}}}catch{}
window.addEventListener('beforeunload',()=>{try{localStorage.setItem('flight-kb-workflow-v1',JSON.stringify({libraries,libraryInfo,files:files.filter(f=>f.id>900||f.library!=='777机队知识库').map(({originalFile,...f})=>f)}));}catch{}});
setupKnowledgeNavigation();
window.kbReference={showLibraries,showFiles,openDetail,emphasizeStats,demoStage,openUpload,createLibrary};showLibraries();

</script></html>
